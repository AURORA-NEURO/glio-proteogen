[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "glio-proteogen"
version = "0.1.0"
description = "A contract-driven, protein-centric glioma research platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary; bundled research-data derivatives retain their stated third-party licenses (see THIRD_PARTY_NOTICES.md)" }
authors = [{ name = "AURORA-NEURO" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.141.1,<1",
  "numpy==2.5.2",
  "pydantic>=2.13.4,<3",
  "typer>=0.27.1,<1",
  "uvicorn>=0.52.1,<1",
]

[project.scripts]
glio-proteogen = "glio_proteogen.adapters.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.130",
  "httpx2>=2.10,<3",
  "jsonschema>=4.23",
  "mypy>=1.15",
  "pip-audit>=2.8",
  "pytest>=8.3",
  "pytest-benchmark>=5.1",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "ruff>=0.11",
  "vulture>=2.16,<3",
  "types-defusedxml>=0.7.0,<1",
  "types-jsonschema>=4.23",
]
source = [
  "h5py==3.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/glio_proteogen"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "glio_proteogen/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.coverage*",
  "/.tmp-*",
  "/coverage.xml",
  "/coverage-*.json",
  "/coverage-*.xml",
  "/current-candidate-receipt.json",
  "/dist-*",
  "/dist",
  "/evidence",
  "/docs/evidence",
  "/docs/release-evidence",
  "/glio-proteogen-evidence.tar.gz",
  "/module-validation.json",
  "/research-state-performance.json",
  "/release-build-*",
  "/.m*-build-*",
  "/.m*-isolated-*",
  "/release-evidence",
  "/tests",
  "/ui/.next",
  "/ui/coverage",
  "/ui/node_modules",
  "/ui/playwright-report",
  "/ui/test-results",
  "/ui/tests",
  "/ui/tsconfig.tsbuildinfo",
  "/worktrees",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=glio_proteogen",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov-fail-under=95",
]
testpaths = ["tests"]
markers = [
  "contract: locked public-contract behavior",
  "integration: adapter and persistence integration",
  "property: generative invariant coverage",
  "benchmark: performance and allocation measurements",
  "policy: ownership and safety boundary checks",
  "historical_artifact: acceptance requires separately supplied dist-m* bundles",
  "package_artifact: acceptance requires a freshly built wheel in dist/",
]

[tool.coverage.run]
branch = true
source = ["glio_proteogen"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "benchmarks", "evals"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "DTZ",
  "E",
  "F",
  "FAST",
  "FBT",
  "FLY",
  "FURB",
  "I",
  "ICN",
  "INP",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]
"benchmarks/**/*.py" = ["S101"]
"src/glio_proteogen/contracts/**/*.py" = ["C901", "TC003", "TRY003"]
"src/glio_proteogen/adapters/api.py" = ["C901", "TC003"]
"src/glio_proteogen/adapters/limits.py" = ["TC003"]
"src/glio_proteogen/kernel/canonical.py" = ["ANN401", "PLR0911", "TC001", "TRY003"]
"src/glio_proteogen/kernel/models.py" = ["TC003", "TRY003"]
"src/glio_proteogen/kernel/plugin.py" = ["PLC0105", "UP046"]
"src/glio_proteogen/research/**/*.py" = ["C901", "E501", "PLR0912", "PLR0913", "PLR2004", "TC003", "TRY003", "UP035"]
"tests/research/**/*.py" = ["ARG005", "PT011", "PT018", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
packages = ["glio_proteogen"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
