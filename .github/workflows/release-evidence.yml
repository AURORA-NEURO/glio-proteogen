name: release-candidate-evidence

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-attest-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      PYTHON_VERSION: "3.12.13"
      SOURCE_DATE_EPOCH: "315532800"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install "$PYTHON_VERSION"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run python -m tools.scan_secrets
      - name: Execute locked tests and coverage
        run: |
          mkdir -p evidence
          uv run pytest tests --junitxml=evidence/tests.junit.xml --cov-report=xml:evidence/coverage.xml
      - name: Execute module evaluations and benchmarks
        run: |
          uv run python -m evals.m01_01.run --output evidence/m01-01-eval.json
          uv run python -m evals.m01_02.run --output evidence/m01-02-eval.json
          uv run python -m evals.m01_03.run --output evidence/m01-03-eval.json
          uv run python -m evals.m01_04.run --output evidence/m01-04-eval.json
          uv run python -m evals.m01_05.run --output evidence/m01-05-eval.json
          uv run python -m evals.m01_06.run --output evidence/m01-06-eval.json
          uv run python -m evals.m01_07.run --output evidence/m01-07-eval.json
          uv run python -m evals.m01_08.run --output evidence/m01-08-eval.json
          uv run python -m evals.m02_01.run --output evidence/m02-01-eval.json
          uv run python -m evals.m02_02.run --output evidence/m02-02-eval.json
          uv run python -m evals.m02_03.run --output evidence/m02-03-eval.json
          uv run python -m evals.m02_04.run --output evidence/m02-04-eval.json
          uv run python -m evals.m02_05.run --output evidence/m02-05-eval.json
          uv run python -m evals.m02_06.run --output evidence/m02-06-eval.json
          uv run python -m evals.m02_07.run --output evidence/m02-07-eval.json
          uv run python -m evals.m02_08.run --output evidence/m02-08-eval.json
          uv run python -m evals.m03_01.run --output evidence/m03-01-eval.json
          uv run python -m evals.m03_02.run --output evidence/m03-02-eval.json
          uv run python -m evals.m03_03.run --output evidence/m03-03-eval.json
          uv run python -m evals.m03_04.run --output evidence/m03-04-eval.json
          uv run python -m evals.m03_05.run --output evidence/m03-05-eval.json
          uv run python -m evals.m03_06.run --output evidence/m03-06-eval.json
          uv run python -m evals.m03_07.run --output evidence/m03-07-eval.json
          uv run python -m evals.m03_08.run --output evidence/m03-08-eval.json
          uv run python -m evals.m04_01.run --output evidence/m04-01-eval.json
          uv run python -m evals.m04_02.run --output evidence/m04-02-eval.json
          uv run python -m evals.m04_03.run --output evidence/m04-03-eval.json
          uv run python -m evals.m04_04.run --output evidence/m04-04-eval.json
          uv run python -m evals.m04_05.run --output evidence/m04-05-eval.json
          uv run python -m evals.m05_01.run --output evidence/m05-01-eval.json
          uv run python -m evals.m05_02.run --output evidence/m05-02-eval.json
          uv run pytest benchmarks/m01_01_validation.py --benchmark-only --benchmark-json=evidence/m01-01-benchmark.json --no-cov
          uv run pytest benchmarks/m01_02_identity_lineage.py --benchmark-only --benchmark-json=evidence/m01-02-benchmark.json --no-cov
          uv run pytest benchmarks/m01_03_ingestion.py --benchmark-only --benchmark-json=evidence/m01-03-benchmark.json --no-cov
          uv run pytest benchmarks/m01_04_quality_metrics.py --benchmark-only --benchmark-json=evidence/m01-04-benchmark.json --no-cov
          uv run pytest benchmarks/m01_05_artifact_detection.py --benchmark-only --benchmark-json=evidence/m01-05-benchmark.json --no-cov
          uv run pytest benchmarks/m01_06_harmonization.py --benchmark-only --benchmark-json=evidence/m01-06-benchmark.json --no-cov
          uv run pytest benchmarks/m01_07_support_routing.py --benchmark-only --benchmark-json=evidence/m01-07-benchmark.json --no-cov
          uv run pytest benchmarks/m01_08_release_packaging.py --benchmark-only --benchmark-json=evidence/m01-08-benchmark.json --no-cov
          uv run pytest benchmarks/m02_01_metadata_validation.py --benchmark-only --benchmark-json=evidence/m02-01-benchmark.json --no-cov
          uv run pytest benchmarks/m02_02_identity_bindings.py --benchmark-only --benchmark-json=evidence/m02-02-benchmark.json --no-cov
          uv run pytest benchmarks/m02_03_identification_ingestion.py --benchmark-only --benchmark-json=evidence/m02-03-benchmark.json --no-cov
          uv run pytest benchmarks/m02_04_quality_metrics.py --benchmark-only --benchmark-json=evidence/m02-04-benchmark.json --no-cov
          uv run pytest benchmarks/m02_05_artifact_detection.py --benchmark-only --benchmark-json=evidence/m02-05-benchmark.json --no-cov
          uv run pytest benchmarks/m02_06_harmonization.py --benchmark-only --benchmark-json=evidence/m02-06-benchmark.json --no-cov
          uv run pytest benchmarks/m02_07_support_router.py --benchmark-only --benchmark-json=evidence/m02-07-benchmark.json --no-cov
          uv run pytest benchmarks/m02_08_release_packaging.py --benchmark-only --benchmark-json=evidence/m02-08-benchmark.json --no-cov
          uv run pytest benchmarks/m03_01_protocol_metadata.py --benchmark-only --benchmark-json=evidence/m03-01-benchmark.json --no-cov
          uv run python -m evals.m03_02.benchmark --output evidence/m03-02-benchmark.json
          uv run python -m evals.m03_03.benchmark --output evidence/m03-03-benchmark.json
          uv run python -m evals.m03_04.benchmark --output evidence/m03-04-benchmark.json
          uv run python -m evals.m03_05.benchmark --output evidence/m03-05-benchmark.json
          uv run python -m evals.m03_06.benchmark --output evidence/m03-06-benchmark.json
          uv run python -m evals.m03_07.benchmark --output evidence/m03-07-benchmark.json
          uv run python -m evals.m03_08.benchmark --output evidence/m03-08-benchmark.json
          uv run python -m evals.m04_01.benchmark --output evidence/m04-01-benchmark.json
          uv run python -m evals.m04_02.benchmark --output evidence/m04-02-benchmark.json
          uv run python -m evals.m04_03.benchmark --output evidence/m04-03-benchmark.json
          uv run python -m evals.m04_04.benchmark --output evidence/m04-04-benchmark.json
          uv run python -m evals.m04_05.benchmark --output evidence/m04-05-benchmark.json
          uv run python -m evals.m05_01.benchmark --output evidence/m05-01-benchmark.json
          uv run python -m evals.m05_02.benchmark --output evidence/m05-02-benchmark.json
          uv run python tools/verify_release_artifacts.py m04-03-evidence \
            evidence/m04-03-eval.json evidence/m04-03-benchmark.json
          uv run python tools/verify_release_artifacts.py m04-04-evidence \
            evidence/m04-04-eval.json evidence/m04-04-benchmark.json
          uv run python tools/verify_release_artifacts.py m04-05-evidence \
            evidence/m04-05-eval.json evidence/m04-05-benchmark.json
          uv run python tools/verify_release_artifacts.py m05-01-evidence \
            evidence/m05-01-eval.json evidence/m05-01-benchmark.json
          uv run python tools/verify_release_artifacts.py m05-02-evidence \
            evidence/m05-02-eval.json evidence/m05-02-benchmark.json
      - name: Audit the full locked development environment
        run: |
          uv run pip-audit --local --format json --progress-spinner off --output evidence/full-environment-dependency-audit.json
      - name: Export and audit the locked runtime dependency set
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file evidence/runtime-requirements.txt
          uv run pip-audit \
            --requirement evidence/runtime-requirements.txt \
            --require-hashes \
            --disable-pip \
            --format json \
            --progress-spinner off \
            --output evidence/runtime-dependency-audit.json
          uv run pip-audit \
            --requirement tools/release-sbom-requirements.txt \
            --require-hashes \
            --disable-pip \
            --format json \
            --progress-spinner off \
            --output evidence/sbom-tool-dependency-audit.json
          uv run pip-audit \
            --requirement tools/release-build-requirements.txt \
            --require-hashes \
            --disable-pip \
            --format json \
            --progress-spinner off \
            --output evidence/build-tool-dependency-audit.json
      - name: Build reproducible candidate distributions
        run: |
          build_environment="$RUNNER_TEMP/release-build-environment"
          build_python="$build_environment/bin/python"
          uv venv "$build_environment" --python "$PYTHON_VERSION"
          uv pip install \
            --python "$build_python" \
            --require-hashes \
            --no-deps \
            --requirement tools/release-build-requirements.txt
          uv pip check --python "$build_python"
          mkdir -p release-build-one release-build-two evidence/distribution
          uv build --python "$build_python" --no-build-isolation --offline --out-dir release-build-one
          uv build --python "$build_python" --no-build-isolation --offline --out-dir release-build-two
          test "$(find release-build-one -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find release-build-one -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          (cd release-build-one && sha256sum * | sort) > "$RUNNER_TEMP/distribution-one.sha256"
          (cd release-build-two && sha256sum * | sort) > "$RUNNER_TEMP/distribution-two.sha256"
          diff --unified "$RUNNER_TEMP/distribution-one.sha256" "$RUNNER_TEMP/distribution-two.sha256"
          cp release-build-one/* evidence/distribution/
          cp "$RUNNER_TEMP/distribution-one.sha256" evidence/distribution-reproducibility.sha256
          wheel="$(find "$GITHUB_WORKSPACE/evidence/distribution" -maxdepth 1 -type f -name '*.whl')"
          echo "RELEASE_WHEEL=$wheel" >> "$GITHUB_ENV"
      - name: Install and test the exact candidate wheel
        run: |
          runtime_environment="$RUNNER_TEMP/glio-proteogen-runtime"
          runtime_python="$runtime_environment/bin/python"
          tag_arguments=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_arguments=(--expected-tag "$GITHUB_REF_NAME")
          fi
          uv venv "$runtime_environment" --python "$PYTHON_VERSION"
          uv pip install \
            --python "$runtime_python" \
            --require-hashes \
            --no-deps \
            --requirement evidence/runtime-requirements.txt
          uv pip install --python "$runtime_python" --no-deps "$RELEASE_WHEEL"
          uv pip check --python "$runtime_python"
          (
            cd "$RUNNER_TEMP"
            "$runtime_python" -I \
              "$GITHUB_WORKSPACE/tools/verify_release_artifacts.py" \
              installed-wheel \
              "$RELEASE_WHEEL" \
              "${tag_arguments[@]}" \
              --report "$GITHUB_WORKSPACE/evidence/installed-wheel-verification.json"
          )
          echo "RELEASE_RUNTIME_PYTHON=$runtime_python" >> "$GITHUB_ENV"
      - name: Generate reproducible runtime SBOM from the wheel environment
        run: |
          sbom_tool_environment="$RUNNER_TEMP/cyclonedx-tool"
          sbom_tool="$sbom_tool_environment/bin/cyclonedx-py"
          uv venv "$sbom_tool_environment" --python "$PYTHON_VERSION"
          uv pip install \
            --python "$sbom_tool_environment/bin/python" \
            --require-hashes \
            --no-deps \
            --requirement tools/release-sbom-requirements.txt
          "$sbom_tool" environment \
            "$RELEASE_RUNTIME_PYTHON" \
            --pyproject "$GITHUB_WORKSPACE/pyproject.toml" \
            --mc-type application \
            --spec-version 1.6 \
            --output-reproducible \
            --output-format JSON \
            --output-file evidence/runtime-sbom.cdx.json
          "$sbom_tool" environment \
            "$RELEASE_RUNTIME_PYTHON" \
            --pyproject "$GITHUB_WORKSPACE/pyproject.toml" \
            --mc-type application \
            --spec-version 1.6 \
            --output-reproducible \
            --output-format JSON \
            --output-file "$RUNNER_TEMP/runtime-sbom-replay.cdx.json"
          cmp evidence/runtime-sbom.cdx.json "$RUNNER_TEMP/runtime-sbom-replay.cdx.json"
          "$RELEASE_RUNTIME_PYTHON" -I \
            "$GITHUB_WORKSPACE/tools/verify_release_artifacts.py" \
            runtime-sbom \
            evidence/runtime-sbom.cdx.json \
            "$RELEASE_WHEEL"
      - name: Assemble content-addressed evidence bundle
        run: |
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence.sha256
          mv evidence.sha256 evidence/SHA256SUMS
          tar --sort=name --mtime=@315532800 --owner=0 --group=0 --numeric-owner -cf - evidence \
            | gzip --no-name > glio-proteogen-evidence.tar.gz
      - name: Attest candidate distribution provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            evidence/distribution/*.whl
            evidence/distribution/*.tar.gz
      - name: Attest candidate wheel runtime SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: evidence/distribution/*.whl
          sbom-path: evidence/runtime-sbom.cdx.json
      - name: Attest the candidate evidence bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: glio-proteogen-evidence.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-candidate-evidence
          path: |
            evidence/
            glio-proteogen-evidence.tar.gz
