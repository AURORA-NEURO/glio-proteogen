  module-evaluator-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - name: Execute one deterministic module validation shard
        run: >-
          uv run python tools/verify_module_validation.py
          --run-evaluators
          --run-benchmarks
          --evaluator-timeout-seconds 300
          --benchmark-timeout-seconds 300
          --shard-index "${{ matrix.shard }}"
          --shard-count 8
          --format json
          --output "module-validation-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: module-validation-${{ matrix.shard }}
          path: module-validation-${{ matrix.shard }}.json
