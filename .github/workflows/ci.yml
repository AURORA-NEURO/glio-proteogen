name: evidence

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - name: Validate workflow YAML syntax and strict mapping keys
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' .github/workflows/*.yml
          uv run python tools/validate_workflows.py
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run vulture src/glio_proteogen evals tools --min-confidence 80
      - run: uv run python tools/verify_project_status.py
      - run: uv run python -m tools.scan_secrets
      - run: uv run pip-audit

  ui-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e

  research-state-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLIS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - name: Check research-state source and benchmark evidence
        run: |
          uv run ruff check \
            src/glio_proteogen/research/proteogenomic_state \
            src/glio_proteogen/adapters/research_state.py \
            benchmarks/research_proteogenomic_state.py \
            tests/research/test_proteogenomic_state_*.py \
            tests/integration/test_research_state_interfaces.py \
            tests/integration/test_research_state_adapter_adversarial.py \
            tests/integration/test_research_state_adapter_coverage.py \
            tests/integration/test_research_state_runtime_guards.py \
            tests/benchmarks/test_research_proteogenomic_state_performance.py
          uv run mypy \
            src/glio_proteogen/research/proteogenomic_state \
            src/glio_proteogen/adapters/research_state.py
      - name: Run exact research-state branch coverage gate
        shell: bash
        run: |
          uv run coverage erase
          uv run coverage run --branch -m pytest -q -o addopts='' \
            tests/research/test_proteogenomic_state_contracts.py \
            tests/research/test_proteogenomic_state_core.py \
            tests/research/test_proteogenomic_state_coverage.py \
            tests/research/test_proteogenomic_state_oracles.py \
            tests/research/test_proteogenomic_state_properties.py \
            tests/integration/test_research_state_interfaces.py \
            tests/integration/test_research_state_adapter_adversarial.py \
            tests/integration/test_research_state_adapter_coverage.py \
            tests/integration/test_research_state_runtime_guards.py \
            tests/benchmarks/test_research_proteogenomic_state_performance.py
          uv run coverage report --fail-under=100 \
            --include='src/glio_proteogen/research/proteogenomic_state/*.py'
          uv run coverage report --fail-under=100 \
            --include='src/glio_proteogen/adapters/research_state.py'
      - name: Enforce ECGI performance and peak-memory thresholds
        run: >-
          uv run python -m benchmarks.research_proteogenomic_state
          --output research-state-performance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: research-state-performance-evidence
          path: research-state-performance.json
          if-no-files-found: ignore

