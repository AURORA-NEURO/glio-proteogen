      - name: Enforce deployment branch coverage
        run: uv run coverage report --fail-under=100 --include=src/glio_proteogen/deployment.py

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the production image
        run: >-
          docker build
          --build-arg VCS_REF="$GITHUB_SHA"
          --build-arg SOURCE_DATE_EPOCH=315532800
          --tag glio-proteogen:ci .
      - name: Emit backend SBOM and reproducibility evidence
        run: |
          docker run --rm --entrypoint python glio-proteogen:ci -c \
            "import importlib.metadata as m,json; packages=sorted(({'name': d.metadata['Name'], 'version': d.version} for d in m.distributions()), key=lambda item: (item['name'].lower(), item['version'])); print(json.dumps(packages, sort_keys=True, separators=(',', ':')))" \
            > backend-python-packages.json
          jq '{bomFormat:"CycloneDX",specVersion:"1.5",version:1,metadata:{component:{type:"application",name:"glio-proteogen"}},components:map({type:"library",name:.name,version:.version})}' \
            backend-python-packages.json > backend-sbom.cdx.json
          docker image inspect glio-proteogen:ci > backend-image-inspect.json
          find src -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum \
            > backend-build-inputs.sha256
          sha256sum Dockerfile docker-entrypoint.sh pyproject.toml uv.lock README.md \
            backend-sbom.cdx.json >> backend-build-inputs.sha256
          docker image inspect glio-proteogen:ci \
            --format '{{json .RootFS.Layers}}' > backend-rootfs-layers.json
          jq -n \
            --arg image_id "$(docker image inspect glio-proteogen:ci --format '{{.Id}}')" \
            --arg vcs_ref "$GITHUB_SHA" \
            --arg source_date_epoch "315532800" \
            --arg build_inputs_sha256 "$(sha256sum backend-build-inputs.sha256 | cut -d' ' -f1)" \
            '{schema:"glio-container-reproducibility/1.0.0",image_id:$image_id,vcs_ref:$vcs_ref,source_date_epoch:$source_date_epoch,build_inputs_manifest_sha256:$build_inputs_sha256}' \
            > backend-reproducibility.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-container-evidence
          path: |
            backend-sbom.cdx.json
            backend-image-inspect.json
            backend-build-inputs.sha256
            backend-rootfs-layers.json
            backend-reproducibility.json
      - name: Start the production image
        run: |
          docker run --detach --name glio-proteogen-ci --publish 8000:8000 \
            --volume glio-proteogen-ci-data:/data/glio-proteogen \
            --env GLIO_PROTEOGEN_DATABASE_PATH=/data/glio-proteogen/events.sqlite3 \
            glio-proteogen:ci
      - name: Exercise probes and verify persistent storage
        run: |
          test "$(docker inspect --format '{{.Config.User}}' glio-proteogen-ci)" = glio
          test "$(docker exec glio-proteogen-ci id -u)" != 0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/livez \
              && curl --fail --silent http://127.0.0.1:8000/readyz \
              && catalog_json="$(curl --fail --silent http://127.0.0.1:8000/v1/deployment/catalog)" \
              && printf '%s' "$catalog_json" | python -c "import json, sys; catalog = json.load(sys.stdin); assert catalog['unmounted_route_limit_prefixes'] == []; assert isinstance(catalog['catalog_digest'], str) and catalog['catalog_digest'].startswith('sha256:')" \
              && curl --fail --silent http://127.0.0.1:8000/v1/modules/M26-01/schemas/request \
              && curl --fail --silent http://127.0.0.1:8000/v1/modules/M23-02/schemas/request \
              && curl --fail --silent http://127.0.0.1:8000/v1/modules/M25-08/schemas/request \
              && curl --fail --silent http://127.0.0.1:8000/v1/contracts/M27-02/output/schema \
              && test "$(docker inspect --format '{{.State.Health.Status}}' glio-proteogen-ci)" = healthy; then
              docker run --rm --volumes-from glio-proteogen-ci \
                --entrypoint python glio-proteogen:ci \
                -c "from pathlib import Path; assert Path('/data/glio-proteogen/events.sqlite3').is_file()"
              exit 0
            fi
            sleep 2
          done
          docker logs glio-proteogen-ci
          exit 1
      - name: Remove the smoke-test container
        if: always()
        run: |
          docker rm --force glio-proteogen-ci
          docker volume rm --force glio-proteogen-ci-data

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - container-smoke
      - ui-quality
    env:
      GLIO_PROTEOGEN_VCS_REF: ${{ github.sha }}
      SOURCE_DATE_EPOCH: "315532800"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate the linked service manifest
        run: docker compose config --quiet
      - name: Start the linked workbench and API
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Exercise analysis and replay through the browser-facing proxy
        run: |
          curl --fail --silent http://127.0.0.1:3000/healthz
          curl --fail --silent http://127.0.0.1:8000/livez
          curl --fail --silent http://127.0.0.1:8000/readyz
          curl --fail --silent http://127.0.0.1:3773/ --output /dev/null
          curl --fail --silent \
            --cookie-jar auth-cookies.txt \
            --dump-header registration-headers.txt \
            --header 'content-type: application/json' \
            --data '{"email":"compose-smoke@example.invalid","password":"compose-smoke-password"}' \
            http://127.0.0.1:3000/api/auth/register \
            --output registration-result.json
          jq -e \
            '.account.email == "compose-smoke@example.invalid" and .pairingAvailable == true and (.pairing.credential | length >= 8) and (.pairing.pairingUrl | startswith("http://127.0.0.1:3773/pair#token="))' \
            registration-result.json
          grep -Eiq '^set-cookie: glio_session=.*Path=/api;.*HttpOnly;.*SameSite=Lax' registration-headers.txt
          curl --fail --silent \
            --cookie auth-cookies.txt \
            http://127.0.0.1:3000/api/auth/me \
            --output account-result.json
          jq -e '.account.email == "compose-smoke@example.invalid"' account-result.json
          curl --fail --silent \
            --cookie auth-cookies.txt \
            --request POST \
            http://127.0.0.1:3000/api/pairing/token \
            --output pairing-result.json
          jq -e --slurpfile registration registration-result.json \
            '.pairing.credential != $registration[0].pairing.credential' \
            pairing-result.json
          test "$(date --date="$(jq --raw-output '.pairing.expiresAt' pairing-result.json)" +%s)" -gt "$(date +%s)"
          test "$(curl --silent --output unauthenticated-pairing.json --write-out '%{http_code}' --request POST http://127.0.0.1:3000/api/pairing/token)" = 401
          docker compose exec -T ui test -f /data/glio-auth/auth.sqlite3
          docker compose exec -T t3-code test -d /data/t3/userdata
          curl --fail --silent \
            --cookie auth-cookies.txt \
            --trace-ascii proxy-request.trace \
            http://127.0.0.1:3000/backend/v1/research/proteogenomic-state/demo \
            --output demo-request.json
          ! grep -Eiq 'Cookie:.*glio_session' proxy-request.trace
          curl --fail --silent \
            --header 'content-type: application/json' \
            --data-binary @demo-request.json \
            http://127.0.0.1:3000/backend/v1/research/proteogenomic-state/analyze \
            --output analysis-result.json
          jq -n \
            --slurpfile request demo-request.json \
            --slurpfile result analysis-result.json \
            '{request:$request[0],result:$result[0]}' > replay-request.json
          curl --fail --silent \
            --header 'content-type: application/json' \
            --data-binary @replay-request.json \
            http://127.0.0.1:3000/backend/v1/research/proteogenomic-state/verify \
            --output replay-result.json
          jq -e \
            '.verified == true and .request_digest_match == true and .profile_digest_match == true and .solver_trace_match == true and .result_digest_match == true and .semantic_match == true' \
            replay-result.json
          curl --fail --silent --cookie auth-cookies.txt --request POST http://127.0.0.1:3000/api/auth/logout --output logout-result.json
          jq -e '.ok == true' logout-result.json
          test "$(curl --silent --cookie auth-cookies.txt --output signed-out.json --write-out '%{http_code}' http://127.0.0.1:3000/api/auth/me)" = 401
      - name: Confirm container isolation
        run: |
          api_container="$(docker compose ps --quiet glio-proteogen)"
          t3_container="$(docker compose ps --quiet t3-code)"
          ui_container="$(docker compose ps --quiet ui)"
          test "$(docker compose exec -T glio-proteogen id -u)" != 0
          test "$(docker compose exec -T t3-code id -u)" != 0
          test "$(docker compose exec -T ui id -u)" != 0
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$api_container")" = true
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$t3_container")" = true
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$ui_container")" = true
          if docker compose exec -T glio-proteogen touch /rootfs-write-probe; then exit 1; fi
          if docker compose exec -T t3-code touch /rootfs-write-probe; then exit 1; fi
          if docker compose exec -T ui touch /rootfs-write-probe; then exit 1; fi
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the linked deployment
        if: always()
        run: docker compose down --volumes --remove-orphans

