name: evidence

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run vulture src/glio_proteogen evals tools --min-confidence 80
      - run: uv run python tools/verify_project_status.py
      - run: uv run python -m tools.scan_secrets
      - run: uv run pip-audit

  model-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - name: Run targeted model tests with branch coverage
        shell: bash
        run: |
          model_tests="$(rg --files tests | rg 'test_.*(m15_05|m1505|m23_01|m2301|m23_02|m2302|m23_03|m2303|m23_04|m2304|m23_05|m2305|m23_07|m2307|m23_08|m2308|m24_02|m2402|m24_03|m2403|m24_04|m2404|m24_05|m2405|m24_06|m2406|m24_07|m2407|m24_08|m2408|m25_01|m2501|m25_02|m2502|m25_03|m2503|m25_04|m2504|m25_05|m2505|m25_06|m2506|m25_07|m2507|m25_08|m2508|m2601|m26_01|m26_02|m2602|m2603|m2604|m2605|m2606|m2607|m2608|m27_02|m2702|m27_03|m2703|m2704|m2705|m2706|m27_07|m2707|m2708|m28_04|m2804)')"
          uv run coverage erase
          uv run coverage run --branch -m pytest -q -o addopts='' \
            $model_tests \
            tests/deployment/test_model_api_transport.py \
            tests/deployment/test_deployed_model_routes.py
